# 守りの部分。工場の制御 (wk) と雛形の検査。docs/TESTING.md
# 速さ: どのジョブも 5 分で打ち切る (超えたら失敗)。ジョブは並んで走る。
name: ci
on:
  pull_request:
  push:
    branches: [main]
  # 人が手で流すとき: base を渡すと、そこからの変更全部にミューテーションをかける
  workflow_dispatch:
    inputs:
      base:
        description: "比べる元のコミット (空なら全部)"
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  PKGS: ./...

jobs:
  # S のテスト・カバレッジ・lint・状態とアイディアの検査・依存の脆弱性
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet $PKGS
      - name: テスト (S と M) とカバレッジ 100% (全部のテストを合わせて、main も含めて数える)
        run: |
          mkdir -p .cover/s .cover/m
          go test -count=1 -cover -coverpkg=./cmd/...,./internal/... $PKGS -args -test.gocoverdir=$PWD/.cover/s
          COVER_M=$PWD/.cover/m go test -count=1 -tags medium -run '^TestM_' ./cmd/wk/
          go tool covdata textfmt -i=.cover/s,.cover/m -o cover.out
          sh scripts/cover-check.sh cover.out
      - run: go run ./cmd/wk check
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 $PKGS

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: sh scripts/fuzz.sh 120

  # ミューテーション: 変えたコードだけ (efficacy 95% 以上・mutant coverage 100%)。internal/ と cmd/wk を別のジョブで並べる
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: internal, exclude: "^cmd/" }
          - { dir: cmd/wk, exclude: "^internal/" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: gremlins
        env:
          BASE: "${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}"
          DIR: "${{ matrix.dir }}"
          EXCLUDE: "${{ matrix.exclude }}"
        # gremlins はモジュールの root で "." を渡す (パスを渡すと --diff と変異が結びつかず、全部が飛ばされる。2026-11-10 に確かめた)
        # (この使い方で本当に変異を試すことは、template-go の「ミューテーションの道具の自己検査」で毎回確かめる)
        run: |
          case "$BASE" in 0000000000000000000000000000000000000000) BASE="" ;; esac
          if [ -n "$BASE" ] && [ -z "$(git diff --name-only "$BASE" -- "$DIR/*.go" ':!*_test.go')" ]; then echo "ok: $DIR の変更なし"; exit 0; fi
          gremlins unleash ${BASE:+--diff "$BASE"} --threshold-efficacy 95 --threshold-mcover 100 --timeout-coefficient 3 \
            --invert-logical --invert-loopctrl -E "$EXCLUDE" -E 'internal/fakegh/' .

  # 仕様: spec/ (工場の流れ・評価の結論) を TLA+ と Z3 で検査し、TestSpec_ とのつながりを確かめる
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: 道具を入れる (tla2tools 1.7.4・z3 5.1.0)
        run: |
          curl -sSfL -o /tmp/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar" | sha256sum -c
          curl -sSfL -o /tmp/z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo "f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  /tmp/z3.zip" | sha256sum -c
          unzip -q /tmp/z3.zip -d /tmp/z3
      - run: sh scripts/formal.sh
        env: { TLA2TOOLS: /tmp/tla2tools.jar, Z3: /tmp/z3/z3-5.1.0-x64-glibc-2.39/bin/z3 }
      - name: 雛形の仕様も
        run: |
          for t in go-cli web; do (cd templates/$t && sh ../../scripts/formal.sh); done
        env: { TLA2TOOLS: /tmp/tla2tools.jar, Z3: /tmp/z3/z3-5.1.0-x64-glibc-2.39/bin/z3 }

  # 雛形そのものを検査する: 雛形からアプリを作り、アプリの CI と同じ検査を流す
  template-go:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: templates/go-cli/go.mod }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { version: v2.15.0, install-only: true }
      - run: sh scripts/instantiate.sh templates/go-cli /tmp/app wk-template-go
      - run: make verify
        working-directory: /tmp/app
      - run: make fuzz FUZZ_SECONDS=40
        working-directory: /tmp/app
      - run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - run: sh scripts/mutate.sh ""
        working-directory: /tmp/app
      # ミューテーションの道具の自己検査: 1 行変えて差分だけを流したとき、本当に変異を試して殺すか
      # (道具の使い方を誤ると、全部を飛ばして「通った」になる。2026-11-10 に実際に起きた)
      - name: ミューテーションの道具の自己検査
        working-directory: /tmp/app
        run: |
          set -o pipefail
          sed -i 's/if c.n >= c.max {/if c.n >= c.max \&\& c.max >= 0 {/' internal/app/counter.go
          git -c user.name=ci -c user.email=ci@example.com commit -qam "1 行変える"
          sh scripts/mutate.sh HEAD~1 | tee /tmp/m.out
          grep -Eq "Killed: [1-9]" /tmp/m.out || { echo "差分のミューテーションが変異を試していない" >&2; exit 1; }

  template-web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: sh scripts/instantiate.sh templates/web /tmp/app wk-template-web
      - run: npm ci --no-audit --no-fund
        working-directory: /tmp/app
      - run: npm run verify
        working-directory: /tmp/app
      - run: npm run fuzz
        working-directory: /tmp/app
        env: { FUZZ_MS: "30000" }
      - run: npm run mutate -- ""
        working-directory: /tmp/app

  template-web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # ブラウザ入りの公式イメージ (版と digest を固定。入れる時間を省いて 5 分に収める)
    container: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: sh scripts/instantiate.sh templates/web /tmp/app wk-template-web
      - run: npm ci --no-audit --no-fund
        working-directory: /tmp/app
      - run: npm run e2e
        working-directory: /tmp/app
        env: { CI: "1", WRANGLER_SEND_METRICS: "false" }

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
