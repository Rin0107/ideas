# 守りの部分。タグ (v*) を push したときだけ、goreleaser が GitHub Releases に配る。
# 書き込み権限はこのジョブにだけ与える。鍵は GITHUB_TOKEN だけ。
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: make verify
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # L のテスト: 配った実行ファイルを、利用者と同じように落として動かす
  large:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Releases から落として動かす
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern '*linux_amd64.tar.gz' --pattern checksums.txt --dir /tmp/rel
          cd /tmp/rel && sha256sum -c --ignore-missing checksums.txt
          tar -xzf ./*linux_amd64.tar.gz
          got=$(./"{{NAME}}" -version)
          test "$got" = "${TAG#v}" || { echo "版が違う: $got"; exit 1; }
