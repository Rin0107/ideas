version: 2
project_name: "{{NAME}}"
builds:
  - main: ./cmd/app
    binary: "{{NAME}}"
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/{{REPO}}/internal/app.Version={{ .Version }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  use: github-native
